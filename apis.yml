aid: 4basecare
name: 4baseCare
description: '4baseCare is a precision oncology company founded in 2018, headquartered
  in Bengaluru, India with operations in Singapore, that combines next-generation-sequencing
  comprehensive genomic profiling with AI-driven clinical decision support to personalize
  cancer treatment. Its portfolio spans the TARGT family of tissue, liquid-biopsy and
  dual-source (SoLiQ) panels, germline and HRD testing, the OncoTwin AI insights layer,
  a Global Cancer Diversity Atlas of 30,000+ genomic profiles, molecular tumor board
  support, and the Oncobuddy patient program. Clinical results and decision support
  are delivered to oncologists through the Galens web portal at galens.4basecare.com.
  The company is Illumina Accelerator backed and closed a Series B round in 2024. As
  of the 2026-09-05 probe it publishes no developer program, no API documentation and
  no machine-readable API contract; the only API-shaped host, api.4basecare.com, is
  the private CodeIgniter application backend behind the Galens single-page app.'
